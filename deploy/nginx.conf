# Nginx HTTPS 反向代理模板（用于云服务器公网安全暴露 FastAPI SPA 控制台）
# 使用前请修改 server_name、SSL 证书路径，并配合 htpasswd 生成基础认证文件（或依赖 DASHBOARD_PASSWORD）：
#   sudo apt install apache2-utils
#   sudo htpasswd -c /etc/nginx/.rpa_htpasswd admin

server {
    listen 80;
    server_name rpa.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name rpa.example.com;

    ssl_certificate     /etc/letsencrypt/live/rpa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpa.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 可选双层认证：Nginx Basic Auth + 控制台 DASHBOARD_PASSWORD
    # auth_basic           "RPA Operations Console";
    # auth_basic_user_file /etc/nginx/.rpa_htpasswd;

    client_max_body_size 32M;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / 长连接转发头（兼容后续实时推送扩展）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
