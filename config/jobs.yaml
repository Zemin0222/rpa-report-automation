job_name: daily_ops_report
timezone: Asia/Shanghai
schedule:
  daily_cron: "30 8 * * *"   # 每天 08:30 自动执行日报
  weekly_cron: "0 9 * * 1"   # 每周一 09:00 生成周报汇总

browser:
  headless: true
  timeout_ms: 15000
  slow_mo_ms: 0

connectors:
  mock_crm:
    enabled: true
    base_url: "http://127.0.0.1:8765"
    username_env: "CRM_USERNAME"
    password_env: "CRM_PASSWORD"
    default_username: "ops_admin"
    default_password: "rpa_demo_pass"
  mock_ads:
    enabled: true
    base_url: "http://127.0.0.1:8765"
    username_env: "ADS_USERNAME"
    password_env: "ADS_PASSWORD"
    default_username: "ads_manager"
    default_password: "rpa_ads_pass"
  mock_finance:
    enabled: true
    base_url: "http://127.0.0.1:8765"
    username_env: "FINANCE_USERNAME"
    password_env: "FINANCE_PASSWORD"
    default_username: "fin_admin"
    default_password: "rpa_fin_pass"
  mock_oa:
    enabled: true
    base_url: "http://127.0.0.1:8765"
    username_env: "OA_USERNAME"
    password_env: "OA_PASSWORD"
    default_username: "oa_staff"
    default_password: "rpa_oa_pass"
  mock_expense:
    enabled: true
    base_url: "http://127.0.0.1:8765"
    username_env: "EXPENSE_USERNAME"
    password_env: "EXPENSE_PASSWORD"
    default_username: "fin_staff"
    default_password: "rpa_exp_pass"
  local_drop:
    enabled: true
    drop_dir: "storage/dropzone"

jobs:
  - job_name: daily_ops_report
    workflow: daily_ops_report
    title: "每日全渠道对账与 OA 日报"
    description: "跨系统抓取 CRM 订单、广告消耗与财务结算 PDF，完成三方对账并自动填写 OA 日报"
    enabled: true
    daily_cron: "30 8 * * *"
    weekly_cron: "0 9 * * 1"
    sources:
      - id: crm_orders
        connector: mock_crm
        role: orders
        enabled: true
        column_mapping: {}
      - id: ads_spend
        connector: mock_ads
        role: ads
        enabled: true
      - id: finance_spa
        connector: mock_finance
        role: finance
        enabled: true
      - id: mail_attachments
        connector: imap_mail
        role: extra_cost
        enabled: false
        deduplicate: true
        params:
          subject_keyword: "每日渠道消耗"
      - id: local_drop
        connector: local_drop
        role: extra_cost
        enabled: true
        deduplicate: false
        archive_after_read: false

  - job_name: expense_reimburse
    workflow: expense_reimburse
    title: "发票智能识别与自动报销"
    description: "自动识别电子发票（PDF/图片），执行重复/超标/抬头合规检查并登录财务报销系统逐单填报上传"
    enabled: true
    daily_cron: "0 17 * * *"
    weekly_cron: "30 17 * * 5"
    sources: []

expense:
  company_name: "星辰智联科技有限公司"
  company_tax_id: "91310115MA1K88990X"
  applicant_name: "林小默"
  department: "运营交付中心"
  max_invoice_age_days: 30
  auto_submit_flagged: false
  category_limits:
    餐饮: 200.0
    交通: 300.0
    住宿: 500.0
    办公: 1000.0
    通信: 300.0

thresholds:
  min_roi: 2.0
  max_sales_drop_pct: 20.0
  max_refund_rate_pct: 15.0
  max_reconcile_diff_yuan: 1.0

notifier:
  dry_run: true
  channel: "feishu"   # feishu / dingtalk
  email_enabled: false

llm:
  enabled: false
  model: "gpt-4o-mini"
  daily_call_budget: 60
  daily_token_budget: 80000
  cache_enabled: true
  max_retries: 1

retention:
  downloads_days: 14
  screenshots_days: 14
  outputs_days: 90
  logs_days: 30
